# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck + Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build (Next)
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Projekt-/Env-Settings von Vercel ziehen (inkl. Environment Variables)
      - name: Vercel pull
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            npx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          fi

      - name: Build (Next)
        run: npm run build

      # Prebuilt-Deployment mit Retries (fängt ETIMEDOUT ab)
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          tries=0
          until [ $tries -ge 3 ]
          do
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" && break
            else
              npx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN" && break
            fi
            tries=$((tries+1))
            sleep $((tries*10))
          done
          if [ $tries -ge 3 ]; then
            echo "Vercel deploy failed after retries"; exit 1
          fi
