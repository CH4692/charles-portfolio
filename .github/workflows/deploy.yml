# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck + Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build (Next)
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # 1) Projekt-/Env-Settings von Vercel ziehen
      - name: Vercel pull
        run: npx -y vercel@46 pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

      # 2) Lokalen Build erzeugen (.vercel/output)
      - name: Vercel build
        run: npx -y vercel@46 build

      # 3) Prebuilt deployen
      - name: Vercel deploy (prebuilt)
        run: npx -y vercel@46 deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
